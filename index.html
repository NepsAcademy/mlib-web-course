<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Movie Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a class="site-name" href="index.html"><img src="assets/images/mlib-icon.svg" alt="" width="31" height="32"> <span>MLib</span></a>
            <nav>
                <a href="index.html" aria-current="page">Movies</a>
                <a href="pages/add-review.html">Review form</a>
            </nav>
        </div>
    </header>
    <main>
        <h1>My Movie Library</h1>
        <p>A collection of movies I have watched.</p>

        <!-- Each poster and title share one existing destination. -->
        <div class="movie-list" id="movies">
            <article class="movie-card">
                <a class="movie-card-link" href="pages/details-code-of-honor.html">
                    <img src="assets/images/code-of-honor-poster.png" alt="" width="240" height="360">
                    <h2>Code of Honor</h2>
                </a>
                <p class="rating">
                    <span class="rating-stars" role="img" aria-label="Rating: 4 out of 5">★★★★☆</span>
                </p>
            </article>

            <article class="movie-card">
                <a class="movie-card-link" href="pages/details-the-merge-conflict.html">
                    <img src="assets/images/the-merge-conflict-poster.jpg" alt="" width="717" height="1024">
                    <h2>The Merge Conflict</h2>
                </a>
                <p class="rating">
                    <span class="rating-stars" role="img" aria-label="Rating: 4 out of 5">★★★★☆</span>
                </p>
            </article>

            <article class="movie-card">
                <a class="movie-card-link" href="pages/details-debugging-reality.html">
                    <img src="assets/images/debugging-reality-poster.jpg" alt="" width="717" height="1024">
                    <h2>Debugging Reality</h2>
                </a>
                <p class="rating">
                    <span class="rating-stars" role="img" aria-label="Rating: 4 out of 5">★★★★☆</span>
                </p>
            </article>
        </div>
    </main>
    <footer>
        <p>MLib &mdash; A static HTML and CSS project</p>
    </footer>
</body>
</html>
