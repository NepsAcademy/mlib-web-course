<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a class="site-name" href="../index.html"><img src="../assets/images/mlib-icon.svg" alt="" width="31" height="32"> <span>MLib</span></a>

                <a href="../index.html">Movies</a>
                <a href="add-review.html">Review form</a>
            </nav>
