<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review form - My Movie Library</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a class="site-name" href="../index.html"><img src="../assets/images/mlib-icon.svg" alt="" width="31" height="32"> <span>MLib</span></a>
            <nav>
                <a href="../index.html">Movies</a>
                <a href="add-review.html" aria-current="page">Review form</a>
            </nav>
        </div>
    </header>
    <main>
        <h1>Review form</h1>
        <p>Send made-up review values and inspect the page address.</p>
        <form class="review-form" action="add-review.html" method="get">
            <p class="form-note">Use made-up values only. Sending this example puts values in the page address. It does not save a review, add a movie, or load a poster.</p>

            <div class="form-field">
                <label for="movie-title">Movie title</label>
                <input type="text" id="movie-title" name="movie_title" required>
            </div>

            <div class="form-field">
                <label for="poster-url">Poster URL (optional)</label>
                <input type="url" id="poster-url" name="poster_url">
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="rating">Rating</label>
                    <select id="rating" name="rating" required>
                        <option value="">Choose a rating</option>
                        <option value="1">1 out of 5</option>
                        <option value="2">2 out of 5</option>
                        <option value="3">3 out of 5</option>
                        <option value="4">4 out of 5</option>
                        <option value="5">5 out of 5</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="watched-on">Watched on (optional)</label>
                    <input type="date" id="watched-on" name="watched_on">
                </div>
            </div>

            <div class="form-field">
                <label for="review">Review</label>
                <textarea id="review" name="review" rows="5" required></textarea>
            </div>

            <button type="submit">Send example</button>
        </form>
    </main>
    <footer>
        <p>MLib &mdash; A static HTML and CSS project</p>
    </footer>
</body>
</html>
